<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f13" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AI 用量</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./mobile.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>
    <div class="mobile-motion" aria-hidden="true">
      <i class="mobile-scan"></i>
      <i class="mobile-edge mobile-edge-top"></i>
      <i class="mobile-edge mobile-edge-bottom"></i>
    </div>
    <section class="pairing-gate" id="pairingGate" hidden>
      <div class="pairing-panel">
        <p class="pairing-kicker" id="pairingKicker">端到端加密</p>
        <h1 id="pairingTitle">连接用量面板</h1>
        <p class="pairing-copy" id="pairingCopy">扫描电脑设置中的二维码，或输入恢复码。</p>
        <label class="pairing-input-wrap" for="pairingInput">
          <span id="pairingInputLabel">恢复码</span>
          <input id="pairingInput" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" />
        </label>
        <button class="pairing-submit" id="pairingSubmit" type="button">连接</button>
        <small class="pairing-note" id="pairingNote">密钥只保存在这个浏览器中</small>
      </div>
    </section>
    <main class="app-shell">
      <header class="app-header">
        <div class="header-copy">
          <h1>AI 用量</h1>
          <p class="eyebrow"><span class="live-dot"></span><span id="connectionLabel">正在连接 Mac</span></p>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="syncDeviceButton" type="button" aria-label="同步设备" title="同步设备" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="10" width="14" height="10" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            </svg>
          </button>
          <button class="icon-button" id="refreshButton" type="button" aria-label="刷新" title="刷新">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7" />
            </svg>
          </button>
        </div>
      </header>

      <div class="control-deck">
        <nav class="provider-switch" id="providerSwitch" aria-label="模型平台"></nav>
        <nav class="view-switch" aria-label="视图">
          <button class="view-button active" type="button" data-view="usage">用量</button>
          <button class="view-button" type="button" data-view="radar">雷达</button>
          <span class="view-thumb" aria-hidden="true"></span>
        </nav>
      </div>

      <section class="view active" id="usageView">
        <div class="section-head">
          <h2 id="usageHeading">Codex 额度</h2>
          <span id="usageUpdated">--</span>
        </div>
        <div class="quota-grid" id="quotaGrid"></div>

        <div class="section-head token-heading">
          <h2>Token 活动</h2>
          <span id="tokenUpdated">近 30 天</span>
        </div>
        <section class="token-card" id="tokenCard"></section>
      </section>

      <section class="view" id="radarView">
        <div class="section-head">
          <h2>今日 IQ</h2>
          <span id="iqUpdated">--</span>
        </div>
        <div class="iq-list" id="iqList"></div>

        <div class="section-head radar-heading">
          <h2>额度雷达</h2>
          <span id="radarSource">--</span>
        </div>
        <section class="radar-card" id="radarCard"></section>
      </section>

      <footer>
        <span id="footerStatus">只读连接</span>
        <span>Codex Menu Meter</span>
      </footer>
    </main>

    <div class="toast" id="toast" role="status"></div>
    <script src="./runtime-config.js"></script>
    <script src="./cloud-sync-crypto.js"></script>
    <script src="./mobile.js"></script>
  </body>
</html>
